<title>数式キーパッド</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:wght@400;600&display=swap">
<style>
/* レイアウト:上に入力欄、下に関数電卓のようなキーを並べた1画面のアプリ。キーは押しやすさを優先して大きくする */
:root {
  --bg: #eef1f4;
  --panel: #ffffff;
  --key: #fbfcfd;
  --key-edge: #c9d0d8;
  --key-fn: #e4ecf7;
  --key-word: #f3efe4;
  --fg: #18202a;
  --muted: #5c6875;
  --accent: #1d5fb8;
  --accent-fg: #ffffff;
  --ok: #1f7a4a;
  --font-math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --font-ui: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161b; --panel: #1b2128; --key: #232a33; --key-edge: #36404c;
    --key-fn: #1f3048; --key-word: #33302a; --fg: #e6ebf0; --muted: #98a4b1;
    --accent: #5b9cf0; --accent-fg: #0c1420; --ok: #5cc48d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161b; --panel: #1b2128; --key: #232a33; --key-edge: #36404c;
  --key-fn: #1f3048; --key-word: #33302a; --fg: #e6ebf0; --muted: #98a4b1;
  --accent: #5b9cf0; --accent-fg: #0c1420; --ok: #5cc48d; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui);
  -webkit-tap-highlight-color: transparent;
}
.app {
  height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px;
  max-width: 560px; margin: 0 auto;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.out-wrap { position: relative; flex: 1 1 auto; min-height: 96px; display: flex; flex-direction: column; }
#out {
  flex: 1; width: 100%; box-sizing: border-box; resize: none;
  font-family: var(--font-math); font-size: 21px; line-height: 1.45;
  background: var(--panel); color: var(--fg);
  border: 1px solid var(--key-edge); border-radius: 10px; padding: 10px 12px;
}
#out:focus-visible, .cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.bar { display: flex; gap: 6px; }
.bar button { flex: 1; min-width: 0; padding: 0 4px; font-size: 14px; white-space: nowrap; }
button {
  font: inherit; color: var(--fg); background: var(--key);
  border: 1px solid var(--key-edge); border-radius: 8px; min-height: 42px;
  touch-action: manipulation; cursor: pointer; user-select: none; -webkit-user-select: none;
}
button:active { transform: translateY(1px); filter: brightness(0.94); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#copy { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; flex: 1.6; }
#copy.done { background: var(--ok); border-color: var(--ok); }
#mode[aria-pressed="true"] { background: var(--key-fn); border-color: var(--accent); }
.tabs { display: flex; gap: 4px; }
.tabs button { flex: 1; min-height: 36px; font-size: 14px; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--fg); border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
.pad { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px; flex: 0 0 auto; }
.pad button {
  min-height: 46px; padding: 2px; font-family: var(--font-math); font-size: 19px;
  overflow: hidden; white-space: nowrap; text-overflow: clip;
}
.pad button.fn { background: var(--key-fn); }
.pad button.word { background: var(--key-word); font-family: var(--font-ui); font-size: 13px; }
.pad button.small { font-size: 14px; }
.pad button.wide { grid-column: span 2; }
.msg { min-height: 1.2em; font-size: 12px; color: var(--muted); }
/* 行列入力 */
.sheet {
  position: absolute; inset: 0; background: var(--panel); border: 1px solid var(--accent);
  border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow: auto;
}
.sheet-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { min-height: 32px; min-width: 32px; }
.stepper span { min-width: 1.4em; text-align: center; font-variant-numeric: tabular-nums; }
.grid-wrap { overflow-x: auto; }
.mgrid { display: grid; gap: 4px; width: max-content; }
.cell {
  width: 3.4em; height: 38px; box-sizing: border-box; text-align: center;
  font-family: var(--font-math); font-size: 18px; color: var(--fg);
  background: var(--key); border: 1px solid var(--key-edge); border-radius: 6px;
}
.cell.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.sheet-actions { display: flex; gap: 6px; margin-top: auto; }
.sheet-actions button { flex: 1; }
.sheet-actions .primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { button:active { transform: none; } }
</style>

<div class="app">
  <div class="out-wrap">
    <textarea id="out" inputmode="none" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="入力した式">f(x,y) = cos(x+2y)/(1−x+y)</textarea>
    <div class="sheet" id="sheet" hidden>
      <div class="sheet-head">
        <strong id="sheet-title">行列</strong>
        <div class="stepper" id="rows-step">行 <button type="button" data-d="-1" aria-label="行を減らす">−</button><span id="rows-n">3</span><button type="button" data-d="1" aria-label="行を増やす">+</button></div>
        <div class="stepper" id="cols-step">列 <button type="button" data-d="-1" aria-label="列を減らす">−</button><span id="cols-n">3</span><button type="button" data-d="1" aria-label="列を増やす">+</button></div>
      </div>
      <div class="grid-wrap"><div class="mgrid" id="mgrid"></div></div>
      <div class="sheet-actions">
        <button type="button" id="sheet-cancel">閉じる</button>
        <button type="button" class="primary" id="sheet-ok">式に入れる</button>
      </div>
    </div>
  </div>
  <div class="bar">
    <button type="button" id="mode" aria-pressed="false" title="スマホの文字キーボードを出す">あ文字</button>
    <button type="button" id="left" aria-label="左へ">◀</button>
    <button type="button" id="right" aria-label="右へ">▶</button>
    <button type="button" id="bs" aria-label="1文字消す">⌫</button>
    <button type="button" id="undo">戻す</button>
    <button type="button" id="clear">全消し</button>
    <button type="button" id="copy">コピー</button>
  </div>
  <div class="msg" id="msg" aria-live="polite">キーで式を作り、「コピー」してチャットに貼り付けます。</div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="pad" id="pad" role="tabpanel"></div>
</div>

<script>
// キーの定義:l=表示、i=入れる文字(省略時はl)、b=カーソルを末尾から何文字戻すか、k=見た目(fn/word/small)、w=2マス分
const F = (l, i, b) => ({ l, i, b, k: "fn" });
const W = (l, i) => ({ l, i: i ?? l, k: "word" });
const TABS = {
  "基本": [
    "x","y","z","t","u","v",
    "7","8","9",{l:"+",i:"+"},{l:"−",i:"−"},"(",
    "4","5","6",{l:"×",i:"×"},"/",")",
    "1","2","3",F("xⁿ","^"),F("x²","²"),"=",
    "0",".",",","a","b","k"
  ],
  "関数": [
    F("sin","sin()",1),F("cos","cos()",1),F("tan","tan()",1),F("eˣ","e^()",1),F("log","log()",1),F("√","√()",1),
    {l:"Sin⁻¹",i:"Sin⁻¹()",b:1,k:"fn small"},{l:"Cos⁻¹",i:"Cos⁻¹()",b:1,k:"fn small"},{l:"Tan⁻¹",i:"Tan⁻¹()",b:1,k:"fn small"},"π","e","∞",
    {l:"(□)/(□)",i:"()/()",b:4,k:"fn small"},F("x³","³"),F("⁻¹","⁻¹"),F("|□|","||",1),"n","!",
    "α","β","θ","λ","φ","ψ",
    {l:"lim",i:"lim ",k:"fn"},{l:"(x,y)→(0,0)",i:"(x,y)→(0,0)",k:"fn small",w:1},"→","≈","±"
  ],
  "微分": [
    F("fx","fx"),F("fy","fy"),F("fxx","fxx"),F("fxy","fxy"),F("fyy","fyy"),{l:"f(x,y)",i:"f(x,y)",k:"fn small"},
    F("∂","∂"),{l:"∂/∂x",i:"∂/∂x",k:"fn small"},{l:"∂/∂y",i:"∂/∂y",k:"fn small"},{l:"d/dt",i:"d/dt",k:"fn small"},"′","″",
    {l:"g(t)",i:"g(t)",k:"fn small"},{l:"g′(t)",i:"g′(t)",k:"fn small"},F("gu","gu"),F("gv","gv"),{l:"φ(u,v)",i:"φ(u,v)",k:"fn small"},{l:"ψ(u,v)",i:"ψ(u,v)",k:"fn small"},
    {l:"∂(x,y)/∂(u,v)",i:"∂(x,y)/∂(u,v)",k:"fn small",w:1},{l:"o(r²)",i:"o(r²)",k:"fn small"},"r","h",{l:"z =",i:"z = ",k:"fn"},
    W("極大値"),W("極小値"),W("で"),W("をとる"),W("なし"),W("停留点")
  ],
  "線形": [
    {l:"行列",i:"@matrix",k:"word"},{l:"縦ベクトル",i:"@vector",k:"word"},F("⟨","⟨"),F("⟩","⟩"),"[","]",
    "a₁","a₂","a₃","a₄","v","w",
    F("₁","₁"),F("₂","₂"),F("₃","₃"),F("₄","₄"),F("ᵀ","ᵀ"),F("⁻¹","⁻¹"),
    F("∩","∩"),F("∈","∈"),F("⊂","⊂"),F("≠","≠"),F("·","·"),{l:"[v]_A",i:"[v]_A",k:"fn small"},
    {l:"dim",i:"dim ",k:"fn small"},{l:"rank",i:"rank ",k:"fn small"},{l:"det",i:"det ",k:"fn small"},{l:"N(A)",i:"N(A)",k:"fn small"},{l:"C(A)",i:"C(A)",k:"fn small"},{l:"R(A)",i:"R(A)",k:"fn small"},
    F("R³","R³"),F("R⁴","R⁴"),{l:"W₁",i:"W₁",k:"fn"},{l:"W₂",i:"W₂",k:"fn"},W("一次独立"),W("一次従属")
  ]
};

const out = document.getElementById("out");
const pad = document.getElementById("pad");
const tabs = document.getElementById("tabs");
const msg = document.getElementById("msg");
const sheet = document.getElementById("sheet");
const mgrid = document.getElementById("mgrid");
const modeBtn = document.getElementById("mode");

let target = out;          // キーが文字を入れる先(入力欄か行列のマス)
let undoStack = [];
let typing = false;

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

// 選択位置を覚えておく(キーを押すとフォーカスが外れる端末があるため)
const sel = new WeakMap();
function remember(el) { sel.set(el, [el.selectionStart ?? el.value.length, el.selectionEnd ?? el.value.length]); }
function getSel(el) { return sel.get(el) || [el.value.length, el.value.length]; }
["select","keyup","click","input","focus"].forEach(ev => out.addEventListener(ev, () => { remember(out); target = out; markActive(); }));
out.addEventListener("input", save);

function save() { store.set("mathpad-draft", out.value); }
function pushUndo(el) { undoStack.push([el, el.value, getSel(el)]); if (undoStack.length > 200) undoStack.shift(); }
function setCaret(el, pos) {
  sel.set(el, [pos, pos]);
  try { el.setSelectionRange(pos, pos); } catch (e) {}
}
function insert(text, back = 0) {
  const el = target;
  pushUndo(el);
  const [s, e] = getSel(el);
  el.value = el.value.slice(0, s) + text + el.value.slice(e);
  setCaret(el, s + text.length - back);
  if (el === out) save();
}
function backspace() {
  const el = target;
  const [s, e] = getSel(el);
  if (s === 0 && e === 0) return;
  pushUndo(el);
  const from = s === e ? prevIndex(el.value, s) : s;
  el.value = el.value.slice(0, from) + el.value.slice(e);
  setCaret(el, from);
  if (el === out) save();
}
// 絵文字などのサロゲートペアを半分だけ消さないようにする
function prevIndex(str, i) { const c = str.charCodeAt(i - 1); return (c >= 0xDC00 && c <= 0xDFFF && i >= 2) ? i - 2 : i - 1; }
function move(d) {
  const el = target;
  const [s, e] = getSel(el);
  const base = d < 0 ? s : e;
  setCaret(el, Math.max(0, Math.min(el.value.length, base + d)));
  if (typing) el.focus();
}

// タブとキー
let current = store.get("mathpad-tab") || "基本";
if (!TABS[current]) current = "基本";
function drawTabs() {
  tabs.innerHTML = "";
  Object.keys(TABS).forEach(name => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = name; b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(name === current));
    b.addEventListener("click", () => { current = name; store.set("mathpad-tab", name); drawTabs(); drawPad(); });
    tabs.appendChild(b);
  });
}
function drawPad() {
  pad.innerHTML = "";
  TABS[current].forEach(raw => {
    const k = typeof raw === "string" ? { l: raw } : raw;
    const b = document.createElement("button");
    b.type = "button"; b.textContent = k.l;
    if (k.k) b.className = k.k;
    if (k.w) b.classList.add("wide");
    // pointerdownでフォーカスを奪わない(カーソル位置を保つ)
    b.addEventListener("pointerdown", ev => ev.preventDefault());
    b.addEventListener("click", () => press(k));
    pad.appendChild(b);
  });
}
function press(k) {
  const text = k.i ?? k.l;
  if (text === "@matrix") return openSheet(false);
  if (text === "@vector") return openSheet(true);
  insert(text, k.b || 0);
}

// 下の操作ボタン
function hold(id, fn) {
  const b = document.getElementById(id);
  b.addEventListener("pointerdown", ev => ev.preventDefault());
  b.addEventListener("click", fn);
}
hold("left", () => move(-1));
hold("right", () => move(1));
hold("bs", backspace);
hold("undo", () => {
  const last = undoStack.pop();
  if (!last) { say("これ以上戻せません。"); return; }
  const [el, val, s] = last;
  el.value = val; sel.set(el, s);
  try { el.setSelectionRange(s[0], s[1]); } catch (e) {}
  if (el === out) save();
});
hold("clear", () => {
  if (!out.value) return;
  target = out; pushUndo(out); out.value = ""; setCaret(out, 0); save();
  say("全部消しました。「戻す」で元に戻せます。");
});
modeBtn.addEventListener("click", () => {
  typing = !typing;
  modeBtn.setAttribute("aria-pressed", String(typing));
  const m = typing ? "text" : "none";
  out.setAttribute("inputmode", m);
  mgrid.querySelectorAll(".cell").forEach(c => c.setAttribute("inputmode", m));
  if (typing) { target.focus(); say("スマホの文字キーボードでも入力できます。もう一度押すと戻ります。"); }
  else { target.blur(); say("キーパッドだけで入力します。"); }
});

const copyBtn = document.getElementById("copy");
copyBtn.addEventListener("click", () => {
  const text = out.value;
  if (!text) { say("式が空です。"); return; }
  const done = () => {
    copyBtn.textContent = "コピーした"; copyBtn.classList.add("done");
    say("チャットの入力欄に貼り付けてください。");
    setTimeout(() => { copyBtn.textContent = "コピー"; copyBtn.classList.remove("done"); }, 1600);
  };
  const fallback = () => {
    out.focus(); out.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    if (ok) done(); else say("自動でコピーできませんでした。式を全部選んだので、長押しして「コピー」を選んでください。");
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, fallback);
  } else fallback();
});

let sayTimer;
function say(t) { msg.textContent = t; clearTimeout(sayTimer); sayTimer = setTimeout(() => { msg.textContent = ""; }, 4000); }

// 行列・縦ベクトルの入力
let rows = 3, cols = 3, vectorMode = false, cellVals = [];
function openSheet(isVector) {
  vectorMode = isVector;
  document.getElementById("sheet-title").textContent = isVector ? "縦ベクトル" : "行列";
  document.getElementById("cols-step").hidden = isVector;
  if (isVector) cols = 1; else if (cols === 1) cols = 3;
  cellVals = [];
  sheet.hidden = false;
  buildGrid();
  say("マスを選んでからキーで数字を入れます。");
}
function closeSheet() { sheet.hidden = true; msg.textContent = ""; target = out; markActive(); }
function buildGrid() {
  document.getElementById("rows-n").textContent = rows;
  document.getElementById("cols-n").textContent = cols;
  mgrid.innerHTML = "";
  mgrid.style.gridTemplateColumns = `repeat(${cols}, auto)`;
  let first = null;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const inp = document.createElement("input");
    inp.className = "cell"; inp.id = `cell-${r}-${c}`;
    inp.setAttribute("inputmode", typing ? "text" : "none");
    inp.setAttribute("aria-label", `${r + 1}行${c + 1}列`);
    inp.autocomplete = "off";
    const key = `${r},${c}`;
    inp.value = cellVals[key] ?? "";
    inp.addEventListener("input", () => { cellVals[key] = inp.value; remember(inp); });
    ["focus","click","keyup","select"].forEach(ev => inp.addEventListener(ev, () => { target = inp; remember(inp); markActive(); }));
    mgrid.appendChild(inp);
    if (!first) first = inp;
  }
  // キーで入れた値も保存されるよう、入力のたびに控えを更新
  target = first; sel.set(first, [first.value.length, first.value.length]); markActive();
}
function syncCells() { mgrid.querySelectorAll(".cell").forEach(c => { const [, r, col] = c.id.split("-"); cellVals[`${r},${col}`] = c.value; }); }
function markActive() { mgrid.querySelectorAll(".cell").forEach(c => c.classList.toggle("active", c === target)); }
document.querySelectorAll(".stepper button").forEach(b => {
  b.addEventListener("click", () => {
    syncCells();
    const d = Number(b.dataset.d);
    if (b.parentElement.id === "rows-step") rows = Math.max(1, Math.min(6, rows + d));
    else cols = Math.max(1, Math.min(6, cols + d));
    buildGrid();
  });
});
document.getElementById("sheet-cancel").addEventListener("click", closeSheet);
document.getElementById("sheet-ok").addEventListener("click", () => {
  syncCells();
  const val = (r, c) => (cellVals[`${r},${c}`] || "").trim() || "0";
  let text;
  if (vectorMode) {
    const items = []; for (let r = 0; r < rows; r++) items.push(val(r, 0));
    text = `(${items.join(", ")})ᵀ`;
  } else {
    const rs = [];
    for (let r = 0; r < rows; r++) { const cs = []; for (let c = 0; c < cols; c++) cs.push(val(r, c)); rs.push(`[${cs.join(", ")}]`); }
    text = `[${rs.join(", ")}]`;
  }
  closeSheet();
  insert(text);
});
// マスでもキー入力が反映されるよう、insert後にcellValsを更新
const _insert = insert;
insert = function (text, back) { _insert(text, back); if (target !== out) syncCells(); };

// 起動
const draft = store.get("mathpad-draft");
if (draft !== null) out.value = draft;
setCaret(out, out.value.length);
drawTabs(); drawPad();
</script>
